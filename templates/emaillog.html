{{define "content"}}
<div class="page-head">
  <h1 class="page-title">Emaillog</h1>
  <span class="page-sub">The last 25 emails Datalix sent you</span>
</div>

{{with .Data}}
<div class="card tbl-scroll">
  {{if .Logs}}
  <table class="tbl">
    <tr><th>Subject</th><th>Date</th><th></th></tr>
    {{range .Logs}}
    <tr>
      <td><strong>{{if .Header}}{{.Header}}{{else}}{{.Template}}{{end}}</strong></td>
      <td>{{fmtUnixTime .CreatedOn}}</td>
      <td style="text-align:right">
        <a class="btn" href="https://datalix.de/cp/emaillog/{{.ID}}" target="_blank"
          rel="noopener noreferrer" title="Opens in the official panel — you must be logged in at datalix.de">view email ↗</a>
      </td>
    </tr>
    {{end}}
  </table>
  {{else}}<p class="mono-sm">No emails logged.</p>{{end}}
</div>
{{end}}
{{end}}
