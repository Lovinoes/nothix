<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Login · Datalix Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080808'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d71921'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/panel.css">
</head>
<body>
<div class="login-viewport">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="login-brand">
      <span class="login-title">Datalix</span>
    </div>
    <p class="login-sub">Client Panel · KVM</p>
    {{if .Err}}<div class="flash err" role="alert">{{.Err}}</div>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <div class="field">
        <label for="apikey">API Key</label>
        <input type="password" id="apikey" name="apikey" autocomplete="off" required autofocus>
      </div>
      <div class="field">
        <label for="userid">User ID <span style="text-transform:none">(optional — auto-detected)</span></label>
        <input type="text" id="userid" name="userid" autocomplete="off" placeholder="only needed if auto-detect fails">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
    </form>
    <p class="login-hint">
      Create an API key in the official
      <a href="https://datalix.eu/cp/" rel="noopener noreferrer">Datalix panel</a>
      under Account → API. The key is kept in server memory only and is never
      sent to your browser.
    </p>
  </div>
</div>
</body>
</html>
